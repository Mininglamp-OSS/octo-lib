name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    # converted_to_draft is kept intentionally: it creates "skipped" check entries
    # that satisfy required-check branch-protection rules when a PR is demoted
    # back to draft, preventing stale "pending" statuses from the last real push.
    branches: [main]
    # paths-ignore is intentionally NOT set here — workflow-level path filtering
    # prevents GitHub from creating any check run, which deadlocks required-status
    # checks on docs-only PRs. Path-based skipping is handled by the `changes`
    # preflight job below (dorny/paths-filter produces 'skipped' statuses that
    # GitHub counts as passing for required checks).
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.20'

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # For push events the paths-filter step is skipped; default to 'false'
      # (code=false is not used for push — push always runs). We use a forward
      # positive pattern list so the logic is unambiguous: code=true when at
      # least one changed file matches a known source pattern.
      code: ${{ github.event_name == 'pull_request' && steps.filter.outputs.code || 'true' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@6852f92c20ea7fd3b0c25de3b5112db3a98da050 # v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # Positive patterns only — no negation, no predicate-quantifier needed.
          # code=true when at least one changed file matches a source pattern.
          # Docs-only PRs (only *.md / docs/) won't match any pattern → code=false
          # and downstream jobs are skipped (skipped counts as passing for required
          # status checks).
          filters: |
            code:
              - '**/*.go'
              - '**/*.proto'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.github/workflows/**'

  build:
    needs: [changes]
    if: |
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      needs.changes.outputs.code == 'true'
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        run: CGO_ENABLED=0 go build -v ./...

  test:
    if: |
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      needs.changes.outputs.code == 'true'
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # gotestsum is pinned to v1.12.0 because v1.12.3+ require Go >= 1.23
      # and v1.13.0 declares 'go 1.24.0' (rejected by Go 1.20 module loader).
      # When GO_VERSION here is bumped, this pin can move forward.
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.0

      - name: Run tests
        id: run-tests
        run: |
          gotestsum \
            --junitfile junit.xml \
            --format short-verbose \
            -- -race -shuffle=on -count=1 -timeout 5m \
               -coverprofile=coverage.out \
               -covermode=atomic ./...

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: |
            junit.xml
            coverage.out
          retention-days: 14

      - name: Write PR summary
        if: always()
        run: |
          outcome="${{ steps.run-tests.outcome }}"

          case "$outcome" in
            success) verdict="✅ **PASSED**" ;;
            failure) verdict="❌ **FAILED**" ;;
            *)       verdict="⏭️ **${outcome}**" ;;
          esac

          total=0; failed=0; errors=0; skipped=0; passed=0
          if [ -f junit.xml ]; then
            # Root <testsuites> aggregates tests/failures/errors; skipped is
            # only on per-suite <testsuite> elements, so sum across all suites.
            total=$(grep -o 'tests="[0-9]*"' junit.xml | head -1 | grep -o '[0-9]*' || echo 0)
            failed=$(grep -o 'failures="[0-9]*"' junit.xml | head -1 | grep -o '[0-9]*' || echo 0)
            errors=$(grep -o 'errors="[0-9]*"' junit.xml | head -1 | grep -o '[0-9]*' || echo 0)
            skipped=$(grep -o 'skipped="[0-9]*"' junit.xml | grep -o '[0-9]*' | paste -sd+ - | bc 2>/dev/null || echo 0)
            passed=$(( total - failed - errors - skipped ))
            [ "$passed" -lt 0 ] && passed=0
          fi

          {
            echo "## 🧪 Test Results"
            echo
            echo "${verdict}"
            echo
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| 🧮 Total | ${total} |"
            echo "| ✅ Passed | ${passed} |"
            echo "| ❌ Failed | ${failed} |"
            echo "| 💥 Errors | ${errors} |"
            echo "| ⏭️ Skipped | ${skipped} |"
            echo
            echo "**Flags:** \`-race -shuffle=on\`"
            echo
            echo "📦 [Download artifacts](../actions/runs/${{ github.run_id }}#artifacts)"
          } >> "$GITHUB_STEP_SUMMARY"

  diff-coverage:
    needs: [changes, test]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.test.result == 'success' &&
      needs.changes.outputs.code == 'true'
    name: Diff Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Least-privilege: only this job needs to comment on PRs.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download test results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-results

      # Diff-only gate: report total coverage but only fail the job when the
      # *diff* coverage drops below 60%. coverage.acceptable is intentionally
      # omitted so this job does not block PRs based on the repo-wide baseline.
      - name: Generate octocov config
        run: |
          cat > .octocov.yml <<'EOF'
          coverage:
            paths:
              - coverage.out
          diff:
            coverage:
              acceptable: 60
          comment:
            enable: true
            hideFooterLink: false
          summary:
            enable: true
          EOF

      - name: Run octocov
        uses: k1LoW/octocov-action@b3b6ee60482a667950f87553abf1df63217235d9 # v1.5.1

  vet:
    needs: [changes]
    if: |
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      needs.changes.outputs.code == 'true'
    name: Vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Vet
        run: go vet ./...
